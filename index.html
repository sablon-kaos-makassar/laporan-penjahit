<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monito – Penjahit</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #FFFFFF;
    --ink:      #1A1A1A;
    --ink2:     #555555;
    --ink3:     #999999;
    --border:   #EBEBEB;
    --orange:   #E8603C;
    --orange-dk:#C94E2C;
    --orange-lt:#FEF0EC;
    --radius:   16px;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
    padding-top: 110px; /* fallback, JS akan hitung tepat */
  }

  /* ── STICKY HEADER WRAPPER ── */
  .sticky-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    background: #fff;
  }

  /* ── TOP BAR ── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .brand { font-size: 22px; font-weight: 800; color: var(--ink); letter-spacing: -.5px; }
  .brand span { color: var(--orange); }
  .hamburger {
    width: 42px; height: 42px;
    background: var(--orange-lt); border: none; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; touch-action: manipulation;
  }
  .hamburger svg { width: 20px; height: 20px; stroke: var(--orange); stroke-width: 2.2; fill: none; stroke-linecap: round; }

  /* ── TAB NAV ── */
  .tab-nav {
    display: flex; overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
    border-bottom: 1.5px solid var(--border);
    scrollbar-width: none; padding: 0 12px;
  }
  .tab-nav::-webkit-scrollbar { display: none; }
  .tab-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 13px 14px 11px;
    border: none; background: none;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px; font-weight: 600; color: var(--ink3);
    cursor: pointer; white-space: nowrap;
    border-bottom: 2.5px solid transparent; margin-bottom: -1.5px;
    transition: color .2s, border-color .2s; flex-shrink: 0;
    touch-action: manipulation;
  }
  .tab-btn.active { color: var(--orange); border-bottom-color: var(--orange); }
  .tab-btn:hover:not(.active) { color: var(--ink2); }

  /* ── TAB PAGES ── */
  .tab-page { display: none; }
  .tab-page.active { display: block; }
  .placeholder {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 80px 20px; color: var(--ink3); font-size: 14px; gap: 10px;
  }
  .placeholder-icon { font-size: 40px; }

  /* ── FILTER BAR ── */
  .filter-bar {
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 11px 16px; display: flex; align-items: center; gap: 8px;
  }
  .filter-bar select {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px; font-weight: 500;
    padding: 9px 32px 9px 12px;
    border: 1.5px solid var(--border); border-radius: 10px;
    background: #F9F9F9; color: var(--ink);
    appearance: none; -webkit-appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23E8603C' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 10px center;
    cursor: pointer; transition: border-color .2s; flex: 1; min-width: 0;
  }
  .filter-bar select:focus { outline: none; border-color: var(--orange); }
  .btn-filter {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px; font-weight: 700; padding: 10px 18px;
    background: var(--orange); color: #fff; border: none; border-radius: 10px;
    cursor: pointer; transition: background .2s, transform .1s;
    box-shadow: 0 3px 10px rgba(232,96,60,.25);
    white-space: nowrap; flex-shrink: 0; touch-action: manipulation;
  }
  .btn-filter:hover { background: var(--orange-dk); }
  .btn-filter:active { transform: scale(.97); }

  /* ── MAIN ── */
  .main { padding: 20px 16px 80px; }

  /* ── SECTION TITLE ── */
  .sec-title {
    font-size: 10px; font-weight: 700; color: var(--ink3);
    text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px;
  }

  /* ── KPI CARDS ── */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(2,1fr);
    gap: 10px; margin-bottom: 24px;
  }
  .kpi-card { border-radius: var(--radius); padding: 16px 14px; animation: fadeUp .45s both; }
  .kpi-card.c-orange { background: #FEF0EC; }
  .kpi-card.c-blue   { background: #EEF3FE; }
  .kpi-card.c-teal   { background: #EBF8F8; }
  .kpi-card.c-yellow { background: #FEF9EC; }
  .kpi-card.c-green  { background: #EDFAF3; }

  .kpi-emoji { font-size: 22px; margin-bottom: 8px; display: block; }
  .kpi-label { font-size: 12px; font-weight: 500; color: var(--ink2); margin-bottom: 4px; }
  .kpi-value { font-size: clamp(24px,6vw,34px); font-weight: 800; line-height: 1; color: var(--ink); }
  .kpi-sub   { font-size: 11px; color: var(--ink3); margin-top: 5px; line-height: 1.4; }

  /* ── AWARD CARDS ── */
  .award-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 24px; }
  .award-card {
    background: var(--orange); border-radius: var(--radius);
    padding: 16px; color: #fff; display: flex; align-items: center; gap: 14px;
    animation: fadeUp .5s both; box-shadow: 0 4px 16px rgba(232,96,60,.2);
  }
  .award-icon {
    font-size: 26px; width: 48px; height: 48px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.2); border-radius: 50%;
  }
  .award-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(255,255,255,.7); margin-bottom: 3px; }
  .award-name  { font-size: 19px; font-weight: 800; color: #fff; line-height: 1.1; }
  .award-detail{ font-size: 12px; color: rgba(255,255,255,.65); margin-top: 3px; }

  /* ── PANEL ── */
  .panel {
    background: #fff; border-radius: var(--radius);
    padding: 16px 14px; margin-bottom: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06); animation: fadeUp .55s both;
  }
  .panel-title { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 16px; display: flex; align-items: center; gap: 7px; }

  /* ── KATEGORI BARS ── */
  .kat-item { margin-bottom: 14px; }
  .kat-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .kat-name { font-size: 13px; font-weight: 600; color: var(--ink); }
  .kat-num  { font-family: 'DM Mono',monospace; font-size: 13px; font-weight: 500; color: var(--ink2); }
  .bar-track { height: 8px; background: #F2F2F2; border-radius: 99px; overflow: hidden; }
  .bar-fill  { height: 100%; border-radius: 99px; transition: width 1s cubic-bezier(.4,0,.2,1); }
  .fill-orange { background: var(--orange); }
  .fill-teal   { background: #2BC4B4; }
  .fill-blue   { background: #5B8DEF; }

  /* ── PENJAHIT TABLE ── */
  .table-scroll-hint { font-size: 10px; color: var(--ink3); text-align: right; margin-bottom: 6px; }
  .table-scroll-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .penjahit-table { width: 100%; min-width: 440px; border-collapse: collapse; font-size: 12px; }
  .penjahit-table th {
    text-align: left; padding: 7px 8px; font-size: 9px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--ink3); border-bottom: 1.5px solid var(--border); background: #FAFAFA;
  }
  .penjahit-table th:not(:first-child) { text-align: right; }
  .penjahit-table td { padding: 9px 8px; border-bottom: 1px solid var(--border); color: var(--ink); vertical-align: middle; }
  .penjahit-table td:not(:first-child) { text-align: right; font-family: 'DM Mono',monospace; font-size: 12px; }
  .penjahit-table tr:last-child td { border-bottom: none; }
  .penjahit-table tr:hover td { background: var(--orange-lt); }
  .penjahit-name { font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .penjahit-avatar {
    width: 28px; height: 28px; border-radius: 10px;
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; color: #fff;
  }
  .pill { display: inline-block; padding: 2px 7px; border-radius: 20px; font-size: 9px; font-weight: 700; }
  .pill-orange { background: #FEF0EC; color: var(--orange); }
  .pill-teal   { background: #E6FAF8; color: #1A9E90; }
  .pill-blue   { background: #EEF3FE; color: #3B6FD4; }

  /* ── BAHAN GRID ── */
  .bahan-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin-bottom: 20px; }
  .bahan-chip {
    background: #FAFAFA; border-radius: 12px; padding: 12px;
    display: flex; align-items: center; gap: 8px; animation: fadeUp .5s both;
  }
  .bahan-chip-dot  { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .bahan-chip-name { font-size: 11px; font-weight: 600; color: var(--ink2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bahan-chip-num  { font-family: 'DM Mono',monospace; font-size: 14px; font-weight: 500; color: var(--ink); flex-shrink: 0; }

  /* ── LOADING / ERROR ── */
  .loading { text-align: center; padding: 60px 20px; color: var(--ink3); }
  .loading-spinner {
    width: 34px; height: 34px; border: 3px solid #F0F0F0;
    border-top-color: var(--orange); border-radius: 50%;
    animation: spin .8s linear infinite; margin: 0 auto 14px;
  }
  .error-msg {
    background: #FFF4F2; border: 1px solid #FDDDD7; border-radius: var(--radius);
    padding: 16px; color: #B03A20; font-size: 13px; line-height: 1.5;
  }

  /* ── SLIDE MENU ── */
  .menu-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.35); z-index: 100;
  }
  .menu-overlay.open { display: block; animation: fadeIn .2s both; }

  .slide-menu {
    position: fixed; top: 0; right: 0;
    width: min(320px,88vw); height: 100%;
    background: #fff; border-radius: 20px 0 0 20px;
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform .28s cubic-bezier(.4,0,.2,1);
    z-index: 101; overflow: hidden;
  }
  .slide-menu.open { transform: translateX(0); }

  .slide-menu-header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .slide-brand { font-size: 20px; font-weight: 800; color: var(--ink); letter-spacing: -.5px; }
  .slide-brand span { color: var(--orange); }
  .slide-sub { font-size: 12px; color: var(--ink3); margin-top: 2px; }
  .slide-close {
    width: 36px; height: 36px; background: #F5F5F5; border: none; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    touch-action: manipulation;
  }
  .slide-close svg { width: 16px; height: 16px; stroke: var(--ink2); stroke-width: 2.2; fill: none; stroke-linecap: round; }

  .slide-menu-body { flex: 1; }

  .slide-menu-footer {
    border-top: 1px solid var(--border);
    padding: 8px 20px 28px;
    display: flex; flex-direction: column;
  }
  .slide-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0; cursor: pointer;
    border: none; background: none; width: 100%; text-align: left;
    font-family: 'Plus Jakarta Sans', sans-serif;
    border-bottom: 1px solid var(--border);
  }
  .slide-item-left { display: flex; align-items: center; gap: 12px; }
  .slide-item-emoji { font-size: 18px; width: 24px; text-align: center; }
  .slide-item-label { font-size: 15px; font-weight: 600; color: var(--ink); }
  .slide-item-arrow { font-size: 18px; color: var(--ink3); }

  .toggle-wrap {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0;
  }
  .toggle-left { display: flex; align-items: center; gap: 12px; }
  .toggle-label { font-size: 15px; font-weight: 600; color: var(--ink); }
  .toggle {
    width: 46px; height: 27px; background: #E0E0E0; border-radius: 99px;
    position: relative; cursor: pointer; transition: background .2s;
    flex-shrink: 0; border: none; touch-action: manipulation;
  }
  .toggle.on { background: var(--orange); }
  .toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 21px; height: 21px; background: #fff; border-radius: 50%;
    transition: left .2s; box-shadow: 0 1px 4px rgba(0,0,0,.15);
  }
  .toggle.on::after { left: 22px; }

  .slide-version {
    font-size: 12px; color: var(--ink3);
    padding-top: 14px; margin-top: 4px;
  }

  /* ── DESKTOP ── */
  @media (min-width: 700px) {
    .topbar { padding: 20px 32px 16px; }
    .tab-nav { padding: 0 24px; }
    .filter-bar { padding: 12px 32px; }
    .main { padding: 28px 32px 80px; max-width: 1200px; }
    .kpi-grid { grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 12px; }
    .award-grid { grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); }
    .two-col { display: grid; grid-template-columns: 1fr 1.5fr; gap: 16px; margin-bottom: 24px; }
    .two-col .panel { margin-bottom: 0; }
    .bahan-grid { grid-template-columns: repeat(auto-fill,minmax(170px,1fr)); }
    .table-scroll-hint { display: none; }
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes spin   { to { transform:rotate(360deg); } }

  .kpi-card:nth-child(1){ animation-delay:.05s }
  .kpi-card:nth-child(2){ animation-delay:.10s }
  .kpi-card:nth-child(3){ animation-delay:.15s }
  .kpi-card:nth-child(4){ animation-delay:.20s }
  .kpi-card:nth-child(5){ animation-delay:.25s }
</style>
</head>
<body>

<!-- STICKY HEADER -->
<div class="sticky-header">

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand">Monito<span>.</span></div>
  <button class="hamburger" onclick="openMenu()" aria-label="Buka menu">
    <svg viewBox="0 0 20 20"><line x1="2" y1="5" x2="18" y2="5"/><line x1="2" y1="10" x2="18" y2="10"/><line x1="2" y1="15" x2="18" y2="15"/></svg>
  </button>
</div>

<!-- TAB NAV -->
<div class="tab-nav">
  <button class="tab-btn" onclick="switchTab('presensi',this)">📅 Presensi</button>
  <button class="tab-btn active" onclick="switchTab('penjahit',this)">✂️ Penjahit</button>
 <button class="tab-btn" onclick="switchTab('inventori',this)">📦 Stok Barang</button>
 <button class="tab-btn" onclick="switchTab('produksi',this)">📋 Orderan</button>
  <button class="tab-btn" onclick="switchTab('keuangan',this)">💰 Keuangan</button>
  <button class="tab-btn" onclick="switchTab('alat-bahan')">🧰 Alat & Bahan</button>
  
</div>

</div><!-- /sticky-header -->

<!-- TAB: PRESENSI -->
<div class="tab-page" id="tab-presensi">
  <div class="placeholder"><div class="placeholder-icon">📅</div><div>Halaman Presensi</div></div>
</div>

<!-- TAB: PENJAHIT -->
<div class="tab-page active" id="tab-penjahit">
  <div class="filter-bar">
    <select id="sel-bulan">
      <option value="">Semua Bulan</option>
      <option value="1">Januari</option><option value="2">Februari</option>
      <option value="3">Maret</option><option value="4">April</option>
      <option value="5">Mei</option><option value="6">Juni</option>
      <option value="7">Juli</option><option value="8">Agustus</option>
      <option value="9">September</option><option value="10">Oktober</option>
      <option value="11">November</option><option value="12">Desember</option>
    </select>
    <select id="sel-tahun"></select>
    <button class="btn-filter" onclick="loadData()">Tampilkan</button>
  </div>
  <div class="main">
    <div class="loading" id="loading-state">
      <div class="loading-spinner"></div>
      <div style="font-size:14px;">Memuat data...</div>
    </div>
    <div id="dashboard-content" style="display:none;"></div>
  </div>
</div>

<!-- TAB: KEUANGAN -->
<div class="tab-page" id="tab-keuangan">
  <div class="placeholder"><div class="placeholder-icon">💰</div><div>Halaman Keuangan</div></div>
</div>

<!-- TAB: INVENTORI -->
<div class="tab-page" id="tab-inventori">
  <div class="placeholder"><div class="placeholder-icon">📦</div><div>Halaman Inventori</div></div>
</div>

<!-- TAB: PRODUKSI -->
<div class="tab-page" id="tab-produksi">
  <div class="placeholder"><div class="placeholder-icon">🏭</div><div>Halaman Produksi</div></div>
</div>

<!-- OVERLAY -->
<div class="menu-overlay" id="menu-overlay" onclick="closeMenu()"></div>

<!-- SLIDE MENU -->
<div class="slide-menu" id="slide-menu">
  <div class="slide-menu-header">
    <div>
      <div class="slide-brand">Monito<span>.</span></div>
      <div class="slide-sub">Sistem manajemen bisnis</div>
    </div>
    <button class="slide-close" onclick="closeMenu()" aria-label="Tutup menu">
      <svg viewBox="0 0 16 16"><line x1="2" y1="2" x2="14" y2="14"/><line x1="14" y1="2" x2="2" y2="14"/></svg>
    </button>
  </div>

  <div class="slide-menu-body"></div>

  <div class="slide-menu-footer">
    <button class="slide-item" onclick="alert('Pengaturan')">
      <div class="slide-item-left">
        <span class="slide-item-emoji">⚙️</span>
        <span class="slide-item-label">Pengaturan</span>
      </div>
      <span class="slide-item-arrow">›</span>
    </button>
    <div class="toggle-wrap">
      <div class="toggle-left">
        <span class="slide-item-emoji">🌙</span>
        <span class="toggle-label">Mode gelap</span>
      </div>
      <button class="toggle" id="dark-toggle" onclick="toggleDark()" aria-label="Toggle mode gelap"></button>
    </div>
    <div class="slide-version">v1.0 · Monito App</div>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwzJZPNIO4Gi5pHRFVDLzZqMpUkL_oM_iHd39IDmofvNf4hsVTVOcLk2V3DudD5fKaY/exec";
  const BULAN_NAMES = ["","Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  const KAT_CONFIG = {
    totebag: { label:"Totebag",  fillClass:"fill-orange", pillClass:"pill-orange", dot:"#E8603C" },
    topi:    { label:"Topi",     fillClass:"fill-teal",   pillClass:"pill-teal",   dot:"#2BC4B4" },
    celemek: { label:"Celemek",  fillClass:"fill-blue",   pillClass:"pill-blue",   dot:"#5B8DEF" },
  };
  const AVATAR_COLORS = ["#E8603C","#2BC4B4","#5B8DEF","#F5A623","#9B59B6","#27AE60"];

  function switchTab(id, btn) {
  const links = {
    'presensi' : 'https://sablon-kaos-makassar.github.io/presensi-karyawan',
    'keuangan' : 'https://sablon-kaos-makassar.github.io/laporan-keuangan',
    'stok': 'https://sablon-kaos-makassar.github.io/stok-barang',
    'orderan' : 'https://sablon-kaos-makassar.github.io/orderan',
   'alat-bahan' ; 'https://sablon-kaos-makassar.github.io/alat-bahan',
  };
  if (links[id]) {
    window.location.href = links[id];
    return;
  }
  document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
}

  function openMenu() {
    document.getElementById('menu-overlay').classList.add('open');
    setTimeout(() => document.getElementById('slide-menu').classList.add('open'), 10);
    document.body.style.overflow = 'hidden';
  }
  function closeMenu() {
    document.getElementById('slide-menu').classList.remove('open');
    document.getElementById('menu-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }
  function toggleDark() {
    document.getElementById('dark-toggle').classList.toggle('on');
  }

  function fixHeaderOffset() {
    const h = document.querySelector('.sticky-header').offsetHeight;
    document.body.style.paddingTop = h + 'px';
  }
  window.addEventListener('resize', fixHeaderOffset);

  document.addEventListener('DOMContentLoaded', () => {
    fixHeaderOffset();
    populateYears();
    setDefaultFilter();
    loadData();
  });

  function populateYears() {
    const sel = document.getElementById('sel-tahun');
    const cur = new Date().getFullYear();
    for (let y = cur; y >= cur - 3; y--) {
      const o = document.createElement('option');
      o.value = y; o.textContent = y; sel.appendChild(o);
    }
  }
  function setDefaultFilter() {
    const now = new Date();
    document.getElementById('sel-bulan').value = now.getMonth() + 1;
    document.getElementById('sel-tahun').value = now.getFullYear();
  }

  async function loadData() {
    showLoading(true);
    const bulan = document.getElementById('sel-bulan').value;
    const tahun = document.getElementById('sel-tahun').value;
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?bulan=${bulan}&tahun=${tahun}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      renderDashboard(await res.json());
    } catch (err) { showError(err.message); }
  }

  function showLoading(on) {
    document.getElementById('loading-state').style.display = on ? 'block' : 'none';
    document.getElementById('dashboard-content').style.display = on ? 'none' : 'block';
  }
  function showError(msg) {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('dashboard-content').style.display = 'block';
    document.getElementById('dashboard-content').innerHTML =
      `<div class="error-msg">⚠️ Gagal memuat data: ${msg}<br><small style="margin-top:6px;display:block;">Pastikan Apps Script URL sudah benar dan sudah di-deploy sebagai Web App.</small></div>`;
  }

  function renderDashboard(d) {
    const bulanLabel = d.filter.bulan ? BULAN_NAMES[d.filter.bulan] : "Semua Bulan";
    const periodeLabel = `${bulanLabel} ${d.filter.tahun || ''}`.trim();
    const totalKat = (d.kategori.totebag + d.kategori.topi + d.kategori.celemek) || 1;

    const html = `
      <div class="sec-title">Ringkasan · ${periodeLabel}</div>
      <div class="kpi-grid">
        <div class="kpi-card c-orange">
          <span class="kpi-emoji">✂️</span>
          <div class="kpi-label">Total Potongan</div>
          <div class="kpi-value">${fmt(d.totalPotongan)}</div>
          <div class="kpi-sub">semua bahan</div>
        </div>
        <div class="kpi-card c-blue">
          <span class="kpi-emoji">👜</span>
          <div class="kpi-label">Totebag</div>
          <div class="kpi-value">${fmt(d.kategori.totebag)}</div>
          <div class="kpi-sub">${pct(d.kategori.totebag,totalKat)}% dari total</div>
        </div>
        <div class="kpi-card c-teal">
          <span class="kpi-emoji">🧢</span>
          <div class="kpi-label">Topi</div>
          <div class="kpi-value">${fmt(d.kategori.topi)}</div>
          <div class="kpi-sub">${pct(d.kategori.topi,totalKat)}% dari total</div>
        </div>
        <div class="kpi-card c-yellow">
          <span class="kpi-emoji">👘</span>
          <div class="kpi-label">Celemek</div>
          <div class="kpi-value">${fmt(d.kategori.celemek)}</div>
          <div class="kpi-sub">${pct(d.kategori.celemek,totalKat)}% dari total</div>
        </div>
        <div class="kpi-card c-green">
          <span class="kpi-emoji">👥</span>
          <div class="kpi-label">Jumlah Penjahit</div>
          <div class="kpi-value">${d.jumlahPenjahit}</div>
          <div class="kpi-sub">${d.namaPenjahit.join(', ')}</div>
        </div>
      </div>

      ${(d.penjahitTerbaik || d.penjahitTercepat) ? `
      <div class="sec-title">Penghargaan Bulan Ini</div>
      <div class="award-grid">
        ${d.penjahitTerbaik ? `
        <div class="award-card">
          <div class="award-icon">🏆</div>
          <div>
            <div class="award-label">Penjahit Terbaik</div>
            <div class="award-name">${d.penjahitTerbaik}</div>
            <div class="award-detail">Jahitan terbanyak bulan ini</div>
          </div>
        </div>` : ''}
        ${d.penjahitTercepat ? `
        <div class="award-card">
          <div class="award-icon">⚡</div>
          <div>
            <div class="award-label">Penjahit Tercepat</div>
            <div class="award-name">${d.penjahitTercepat.nama}</div>
            <div class="award-detail">Rata-rata ${d.penjahitTercepat.rataHari} hari / order</div>
          </div>
        </div>` : ''}
      </div>` : ''}

      <div class="two-col">
        <div class="panel">
          <div class="panel-title">📊 Distribusi Kategori</div>
          ${['totebag','topi','celemek'].map(k => `
            <div class="kat-item">
              <div class="kat-header">
                <span class="kat-name">${KAT_CONFIG[k].label}</span>
                <span class="kat-num">${fmt(d.kategori[k])}</span>
              </div>
              <div class="bar-track">
                <div class="bar-fill ${KAT_CONFIG[k].fillClass}" style="width:${pct(d.kategori[k],totalKat)}%"></div>
              </div>
            </div>`).join('')}
        </div>
        <div class="panel">
          <div class="panel-title">🧵 Performa Penjahit</div>
          <div class="table-scroll-hint">← geser untuk lihat semua →</div>
          <div class="table-scroll-wrap">
            <table class="penjahit-table">
              <thead>
                <tr>
                  <th>Penjahit</th><th>Total</th>
                  <th><span class="pill pill-orange">Totebag</span></th>
                  <th><span class="pill pill-teal">Topi</span></th>
                  <th><span class="pill pill-blue">Celemek</span></th>
                  <th>Rata Hari</th>
                </tr>
              </thead>
              <tbody>
                ${d.penjahit.sort((a,b)=>b.total-a.total).map((p,i) => `
                <tr>
                  <td>
                    <div class="penjahit-name">
                      <div class="penjahit-avatar" style="background:${AVATAR_COLORS[i%AVATAR_COLORS.length]}">
                        ${p.nama.charAt(0).toUpperCase()}
                      </div>
                      ${p.nama}
                    </div>
                  </td>
                  <td><strong>${fmt(p.total)}</strong></td>
                  <td>${fmt(p.totebag)}</td>
                  <td>${fmt(p.topi)}</td>
                  <td>${fmt(p.celemek)}</td>
                  <td>${p.rataHariPengerjaan ? p.rataHariPengerjaan+'h' : '—'}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="sec-title">Detail Bahan</div>
      <div class="bahan-grid">
        ${d.bahanDetail.sort((a,b)=>b.jumlah-a.jumlah).map(b => `
        <div class="bahan-chip">
          <div class="bahan-chip-dot" style="background:${KAT_CONFIG[b.kategori]?.dot||'#ccc'}"></div>
          <div class="bahan-chip-name" title="${b.nama}">${b.nama}</div>
          <div class="bahan-chip-num">${fmt(b.jumlah)}</div>
        </div>`).join('')}
      </div>
    `;

    document.getElementById('dashboard-content').innerHTML = html;
    showLoading(false);
    setTimeout(() => {
      document.querySelectorAll('.bar-fill').forEach(el => {
        const w = el.style.width; el.style.width = '0';
        requestAnimationFrame(() => { el.style.width = w; });
      });
    }, 50);
  }

  function fmt(n) { return Number(n||0).toLocaleString('id-ID'); }
  function pct(a,b) { return b ? Math.round((a/b)*100) : 0; }
</script>
</body>
</html>
